<!DOCTYPE html>
<html lang="es-MX">

<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>HTML5 Canvas Drawing Tool</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <!-- Bootstrap -->
    <link rel="stylesheet" href="./assets/css/bootstrap.min.css" />
    <!-- FontAwesome -->
    <link rel="stylesheet" href="./assets/css/all.min.css" />
    <!-- JQuery -->
    <script src="./assets/js/jquery-3.6.0.min.js"></script>
    <!-- Bootstrap JS -->
    <script src="./assets/js/bootstrap.min.js"></script>

    <style>
        body {
            background-color: #212529;
        }
        .panel-box {
            background: #ffffff;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.10);
        }
        .tool-button {
            width: 100%;
        }
        .canvas-wrapper {
            width: 100%;
            overflow-x: auto;
            text-align: center;
        }
        #canvas {
            max-width: 100%;
            height: auto;
            background-color: white;
            border: 2px solid darkgray;
            border-radius: 5px;
        }
        .section-title {
            font-size: 1.1rem;
            font-weight: bold;
            margin-bottom: 15px;
        }
    </style>
</head>

<body>
    <div class="container-fluid py-4">
        <div class="row g-4">
            <!-- ========================= -->
            <!-- PANEL LATERAL -->
            <!-- ========================= -->

            <div class="col-12 col-lg-3">
                <div class="panel-box h-100">
                    <!-- HERRAMIENTAS -->
                    <div class="mb-4">
                        <div class="section-title">
                            Herramientas
                        </div>

                        <div class="row g-2">
                            <div class="col-6">
                                <button class="btn btn-secondary tool-button" id="btnDrawCuadro">
                                    <i class="fas fa-square"></i>
                                    Cuadro

                                </button>
                            </div>

                            <div class="col-6">
                                <button class="btn btn-secondary tool-button" id="btnDrawLinea">
                                    <i class="fas fa-pen"></i>
                                    Línea
                                </button>
                            </div>

                            <div class="col-6">
                                <button class="btn btn-secondary tool-button" id="btnDrawTexto">
                                    <i class="fas fa-font"></i>
                                    Texto
                                </button>
                            </div>

                            <div class="col-6">

                                <button class="btn btn-secondary tool-button" id="btnDrawImage">

                                    <i class="fas fa-images"></i>
                                    Imagen

                                </button>

                            </div>

                        </div>

                    </div>

                    <hr>

                    <!-- ACCIONES -->
                    <div class="mb-4">

                        <div class="section-title">
                            Acciones
                        </div>

                        <div class="row g-2">

                            <div class="col-4">

                                <button class="btn btn-warning tool-button" id="btnUndo">

                                    <i class="fas fa-undo"></i>

                                </button>

                            </div>

                            <div class="col-4">

                                <button class="btn btn-danger tool-button" id="btnClearTodo">

                                    <i class="fas fa-broom"></i>

                                </button>

                            </div>

                            <div class="col-4">

                                <button class="btn btn-success tool-button" id="btnSave">

                                    <i class="fas fa-download"></i>

                                </button>

                            </div>

                        </div>

                    </div>

                    <hr>

                    <!-- CONFIGURACION -->
                    <div class="mb-4">

                        <div class="section-title">
                            Configuración
                        </div>

                        <div class="mb-3">

                            <label for="txtAncho" class="form-label">

                                Ancho
                            </label>

                            <input type="number" id="txtAncho" class="form-control" />

                        </div>

                        <div class="mb-3">

                            <label for="txtAlto" class="form-label">

                                Alto
                            </label>

                            <input type="number" id="txtAlto" class="form-control" />

                        </div>

                        <div class="mb-3">

                            <label for="inpColor" class="form-label">

                                Color
                            </label>

                            <input type="color" id="inpColor" class="form-control form-control-color w-100" />

                        </div>

                        <div class="mb-3">

                            <label for="inpRango" class="form-label">

                                Grosor de Línea
                            </label>

                            <input type="range" id="inpRango" class="form-range" min="1" max="100" />

                            <p id="pGrosor" class="small text-muted mb-0">
                            </p>

                        </div>

                        <div class="mb-3">

                            <label for="slctTrazo" class="form-label">

                                Tipo de Trazo
                            </label>

                            <select id="slctTrazo" class="form-select">

                                <option value="">
                                    Selecciona
                                </option>

                                <option value="butt">
                                    Default
                                </option>

                                <option value="round">
                                    Redondeado
                                </option>

                                <option value="square">
                                    Cuadrado
                                </option>

                            </select>

                        </div>

                    </div>

                    <hr>

                    <!-- TEXTO -->
                    <div class="mb-4">

                        <div class="section-title">
                            Texto
                        </div>

                        <div class="mb-3">

                            <label for="txtDrawText" class="form-label">

                                Texto
                            </label>

                            <input type="text" id="txtDrawText" class="form-control" />

                        </div>

                        <div class="mb-3">

                            <label for="slctDrawTextAlign" class="form-label">

                                Alineación
                            </label>

                            <select id="slctDrawTextAlign" class="form-select">

                                <option value="">
                                    Selecciona
                                </option>

                                <option value="start">
                                    Inicio
                                </option>

                                <option value="left">
                                    Izquierda
                                </option>

                                <option value="center">
                                    Centro
                                </option>

                                <option value="right">
                                    Derecha
                                </option>

                            </select>

                        </div>

                        <div class="mb-3">

                            <label for="slctDrawTextStyle" class="form-label">

                                Estilo
                            </label>

                            <select id="slctDrawTextStyle" class="form-select">

                                <option value="">
                                    Selecciona
                                </option>

                                <option value="normal">
                                    Normal
                                </option>

                                <option value="bold">
                                    Negrita
                                </option>

                            </select>

                        </div>

                        <div class="mb-3">

                            <label for="txtDrawTextSize" class="form-label">

                                Tamaño
                            </label>

                            <input type="number" id="txtDrawTextSize" class="form-control" />

                        </div>

                        <div class="mb-3">

                            <label for="slctDrawTextFont" class="form-label">

                                Fuente
                            </label>

                            <select id="slctDrawTextFont" class="form-select">

                                <option value="">
                                    Selecciona
                                </option>

                                <option value="Arial">
                                    Arial
                                </option>

                                <option value="Tahoma">
                                    Tahoma
                                </option>

                                <option value="Consolas">
                                    Consolas
                                </option>

                                <option value="sans-serif">
                                    Sans Serif
                                </option>

                            </select>

                        </div>

                    </div>

                    <hr>

                    <!-- IMAGEN -->
                    <div>

                        <div class="section-title">
                            Imagen
                        </div>

                        <div class="mb-3">

                            <label for="inpImage" class="form-label">

                                Cargar Imagen
                            </label>

                            <input type="file" id="inpImage" class="form-control" />

                        </div>

                        <div class="form-check mb-3">

                            <input type="checkbox" class="form-check-input" id="chckRedimImage" />

                            <label class="form-check-label" for="chckRedimImage">

                                Redimensionar Imagen

                            </label>

                        </div>

                        <div class="row">

                            <div class="col-6">

                                <label for="txtAncho_Image" class="form-label">

                                    Ancho

                                </label>

                                <input type="number" id="txtAncho_Image" class="form-control" />

                            </div>

                            <div class="col-6">

                                <label for="txtAlto_Image" class="form-label">

                                    Alto

                                </label>

                                <input type="number" id="txtAlto_Image" class="form-control" />

                            </div>

                        </div>

                    </div>

                </div>

            </div>

            <!-- ========================= -->
            <!-- CANVAS -->
            <!-- ========================= -->

            <div class="col-12 col-lg-9">

                <div class="panel-box">

                    <div class="d-flex justify-content-between align-items-center mb-3">

                        <h4 class="mb-0">
                            HTML5 Canvas Drawing Tool
                        </h4>

                        <p id="pCoordinates" class="mb-0 text-muted">
                        </p>

                    </div>

                    <div class="canvas-wrapper">

                        <canvas id="canvas"></canvas>

                    </div>

                </div>

            </div>

        </div>

    </div>

    <!-- ========================= -->
    <!-- SCRIPTS -->
    <!-- ========================= -->
    <script src="./assets/js/state.js"></script>
    <script src="./assets/js/helpers.js"></script>
    <script src="./assets/js/renderer.js"></script>
    <script src="./assets/js/canvas.js"></script>
    <script src="./assets/js/ui.js"></script>
    <script src="./assets/js/events.js"></script>
    <script src="./assets/js/app.js"></script>
</body>

</html>
